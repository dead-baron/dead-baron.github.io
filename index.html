<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dead Baron</title>
<meta name="description" content="Games by Dead Baron.">
<style>
  :root { --bg: #05020f; --ink: #eaf6ff; --dim: #9a8fd6; --pink: #FF3D91; --cyan: #1DE9FF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  body { display: grid; place-items: center; padding: 24px 16px;
    background-image: linear-gradient(rgba(114,91,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(114,91,255,.08) 1px, transparent 1px);
    background-size: 48px 48px; }
  main { text-align: center; max-width: 420px; width: 100%; }
  h1 { margin: 0 0 6px; font-size: clamp(34px, 10vw, 56px); letter-spacing: 6px;
    text-shadow: 0 0 10px var(--pink), 0 0 28px var(--pink); }
  p { margin: 0 0 36px; color: var(--dim); letter-spacing: 4px; font-size: 13px; }
  a.game { display: block; padding: 18px; border: 2px solid var(--cyan); border-radius: 10px; color: var(--cyan);
    text-decoration: none; letter-spacing: 4px; font-weight: 700; font-size: 18px;
    box-shadow: 0 0 12px rgba(29,233,255,.5), inset 0 0 12px rgba(29,233,255,.25); text-shadow: 0 0 8px var(--cyan); }
  a.game small { display: block; margin-top: 6px; font-weight: 400; font-size: 11px; color: var(--dim); text-shadow: none; }
  a.game:hover, a.game:focus-visible { background: rgba(29,233,255,.08); outline: none; }
</style>
</head>
<body>
<main>
  <h1>DEAD BARON</h1>
  <p>GAMES</p>
  <a class="game" href="/neon-asteroids/">NEON ASTEROIDS<small>1v1 NEON DOGFIGHTS · PHONE OR COMPUTER</small></a>
</main>
</body>
</html>
